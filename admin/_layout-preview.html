<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin — Shared Layout Preview</title>

    <!-- Tokens must load before the shared layout stylesheet -->
    <link rel="stylesheet" href="../assets/css/design-tokens.css">
    <link rel="stylesheet" href="../assets/css/shared-layout.css">
    <style>
        body { margin: 0; }
    </style>
</head>
<body class="at-shell">

    <!-- SHARED TOP APP BAR (injected) -->
    <div data-at-topbar data-title="Admin Portal"></div>

    <!-- SHARED SIDEBAR (injected, admin nav set) -->
    <div data-at-sidebar data-role="admin" data-active="verify-drivers"></div>

    <main class="at-main">
        <div class="at-content">
            <section class="at-section">
                <h1 style="font-size:var(--font-size-h1); font-weight:var(--font-weight-semibold); line-height:var(--line-height-h1); margin:0 0 var(--space-lg);">
                    Admin Layout Preview
                </h1>

                <div class="at-card-grid">
                    <article class="at-card">
                        <div class="at-card__header">
                            <div>
                                <h2 class="at-card__title">Awaiting Verification</h2>
                                <p class="at-card__subtitle">Driver applications</p>
                            </div>
                            <span class="at-badge at-badge--pending">Pending</span>
                        </div>
                        <p style="margin:0; font-size:var(--font-size-h1); font-weight:var(--font-weight-semibold);">4</p>
                    </article>

                    <article class="at-card">
                        <div class="at-card__header">
                            <div>
                                <h2 class="at-card__title">Verified Drivers</h2>
                                <p class="at-card__subtitle">Cleared to drive</p>
                            </div>
                            <span class="at-badge at-badge--verified">Verified</span>
                        </div>
                        <p style="margin:0; font-size:var(--font-size-h1); font-weight:var(--font-weight-semibold);">27</p>
                    </article>

                    <article class="at-card">
                        <div class="at-card__header">
                            <div>
                                <h2 class="at-card__title">Rejected</h2>
                                <p class="at-card__subtitle">Failed review</p>
                            </div>
                            <span class="at-badge at-badge--rejected">Rejected</span>
                        </div>
                        <p style="margin:0; font-size:var(--font-size-h1); font-weight:var(--font-weight-semibold);">2</p>
                    </article>
                </div>
            </section>
        </div>
    </main>

    <script src="../assets/js/shared-layout.js"></script>
</body>
</html>
